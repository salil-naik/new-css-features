<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Grid Gap | New CSS Features</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/pages.css">
	<style>	
		.feature-demo{font-size:50px; font-weight:bold; overflow-x:clip;}
		#container-flex{
			background-color:black; display:flex; flex-direction:row;}

		#container-flex .element{background-color:orange; height:300px; width:500px; margin:20px;}
		
		#container-grid{
			margin-top:30px;
			background-color:black; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:20px; padding:20px;
		}

		#container-grid .element{background-color:orange; height:300px;}


	</style>
</head>
<body>
	<header class="site-header">
		<a class="site-brand" href="index.html">New CSS Features</a>
		<a class="back-link" href="index.html">← All features</a>
	</header>
	<main class="feature-page">
		<div class="feature-heading">
			<p class="feature-kicker">CSS Layout</p>
			<h1>Grid Gap</h1>
			<p class="feature-description">Compare spacing with margins in Flexbox and the native gap property in CSS Grid.</p>
		</div>
		<section class="feature-demo">
		<div id="container-flex">
			<div class="element">A</div>
			<div class="element">B</div>
			<div class="element">C</div>
		</div>

		<div id="container-grid">
			<div class="element">E</div>
			<div class="element">F</div>
			<div class="element">G</div>
		</div>
		</section>
	</main>
</body>
</html>

<style>
	#container-flex{display:flex; flex-direction:row;}

	#container-grid{
		display:grid; 
		grid-template-columns: 1fr 1fr 1fr; 
		gap:20px;
		padding:20px;
	}
</style>
